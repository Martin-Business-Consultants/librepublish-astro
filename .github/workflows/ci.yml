# The integration's build, types and unit tests (on the contract copied into
# librepublishgo/), and the example site end to end against a Go core built
# at the librepublishgo commit those copies are from (librepublishgo/SOURCE),
# on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Test (on librepublishgo/contracts)
        run: npm test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The librepublishgo commit the contract is from
        id: source
        run: echo "sha=$(cat librepublishgo/SOURCE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Martin-Business-Consultants/librepublishgo
          ref: ${{ steps.source.outputs.sha }}
          path: .librepublishgo
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .librepublishgo/go.mod
          check-latest: true
          cache-dependency-path: .librepublishgo/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - name: Build the Go core
        working-directory: .librepublishgo
        run: go build -o "$RUNNER_TEMP/librepublish" ./cmd/librepublish
      - name: Install the integration and the example
        run: |
          npm ci
          npm run build
          (cd example && npm ci)
      - name: End to end
        env:
          LIBREPUBLISH_BIN: ${{ runner.temp }}/librepublish
        run: npm run e2e
